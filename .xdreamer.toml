# xdreamer project configuration
# Place this file in your project root as .xdreamer.toml
# Global defaults live in ~/.xdreamer/config.toml
# CLI flags override everything.

[model]
# provider: always "lmstudio" in v1
provider        = "lmstudio"

# base_url: address of the LM Studio local server (Local Server tab → host:port)
# Override via XDREAMER_MODEL_BASE_URL
base_url        = "http://localhost:1234/v1"

# model: exact model identifier shown in LM Studio's server tab
# Override via XDREAMER_MODEL
model           = "qwen2.5-coder-7b"

# embed_model: embedding model loaded in LM Studio, used by the RAG engine
# Override via XDREAMER_EMBED_MODEL
embed_model     = "nomic-embed-text-v1.5"

# context_window: maximum tokens to send per request (match your model's limit)
context_window  = 8192

# temperature: 0.0 = deterministic, 1.0 = creative
temperature     = 0.2

# max_retries: how many times to retry on 429 or 5xx errors
max_retries     = 3

# retry_delay_ms: milliseconds to wait between retries
retry_delay_ms  = 1000

[agent]
# auto: skip confirmation prompts for destructive tool actions
# Override via XDREAMER_AUTO or --auto flag
auto            = false

# max_steps: hard limit on LLM turns per task to prevent infinite loops
# Override via XDREAMER_MAX_STEPS
max_steps       = 50

# worktree_base: directory (relative to project root) where git worktrees are created
worktree_base   = ".xdreamer/worktrees"

[rag]
# enabled: set to false to skip codebase indexing (faster startup, no context injection)
enabled         = true

# chunk_size: maximum tokens per indexed chunk
chunk_size      = 512

# chunk_overlap: tokens of overlap carried into the next chunk for continuity
chunk_overlap   = 64

# top_k: number of chunks retrieved per LLM turn
top_k           = 10

# index_dir: where the vector store and manifest are stored
index_dir       = ".xdreamer/index"

# ignore: paths skipped during indexing (prefix or glob matched against directory names)
ignore          = ["vendor/", "node_modules/", ".git/"]

[memory]
# enabled: set to true to read/write .xdreamer/MEMORY.md across sessions
enabled         = false

# file: path to the project memory file (relative to project root)
file            = ".xdreamer/MEMORY.md"

[output]
# log_dir: directory for transcript logs (.log) and patch files (.patch)
# Override via XDREAMER_LOG_DIR
log_dir         = "."
